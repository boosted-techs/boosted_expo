limit_req_zone $binary_remote_addr zone=boosted_one_ip:5m rate=10r/s;
limit_conn_zone $server_name zone=boosted_one_total:1m;
limit_conn_zone $binary_remote_addr zone=boosted_one_client:5m;
server {
    listen 80;
    listen [::]:80;
    server_name boostedone.online;
    location /.well-known/acme-challenge/ { root /var/www/boosted-one-acme; }
    location / { return 301 https://boostedone.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name boostedone.online;
    ssl_certificate /etc/letsencrypt/live/boostedone.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boostedone.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BOOSTED_ONE_TLS:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 16m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    limit_conn boosted_one_total 40;
    limit_conn boosted_one_client 10;
    limit_conn_status 429;
    location ~ /\. { deny all; }
    location ~* ^/(?:vendor|storage|bootstrap|config|database|tests)(?:/|$) { return 404; }
    location / {
        limit_req zone=boosted_one_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3230;
        proxy_set_header Host boostedone.online;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded '';
        proxy_set_header Proxy '';
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;
        proxy_buffering on;
        proxy_max_temp_file_size 0;
    }
}
